[package]
name = "nekobot"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ollama-rs = { version = "0.3.6", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlite = "0.37.4"
teloxide = { version = "0.17.0" }
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
