[package]
name = "nekobot"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy_reflect = "0.20.0"
clap = { version = "4.6.7", features = ["derive"] }
ollama-rs = { version = "0.3.6", features = ["tokio"] }
rhai = { version = "1.26.1", features = ["serde"] }
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
teloxide = { version = "0.17.0" }
tokio = { version = "1.54.0", features = ["full"] }
toml = "1.1.8"
